input GetModelHealthSnapshotsInput {
  displayModels: [String!]
}

input GetDiscoveredModelHealthSnapshotsInput {
  displayModels: [String!]
}

input GetModelHealthHistoryInput {
  displayModel: String
  actualModelID: String
  channelIDs: [ID!]
}

input ManualModelProbeInput {
  displayModel: String!
  actualModelID: String!
  channelID: ID!
}

extend type Query {
  modelHealthSnapshots(input: GetModelHealthSnapshotsInput!): [ModelHealthSnapshot!]!
  discoveredModelHealthSnapshots(input: GetDiscoveredModelHealthSnapshotsInput!): [ModelHealthSnapshot!]!
  modelHealthHistory(input: GetModelHealthHistoryInput!): [ModelHealthHistory!]!
}

extend type Mutation {
  manualModelProbe(input: ManualModelProbeInput!): Boolean!
  resetDiscoveredModelHealth: Boolean!
}
